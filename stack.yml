# StackWatch config.
#
# Scoping rules applied (see ANALYSIS below):
#   * Only packages present in a PRODUCTION image / host are listed.
#   * `version:` pins let osv.dev filter server-side to vulns that affect the
#     deployed version — the single biggest noise reducer. Up-to-date pins go
#     near-silent until a *new* affecting CVE lands.
#   * `tier:` no longer drives @here. Routing is now severity + patch based:
#       CVSS < drop_below_cvss        -> dropped
#       drop_below <= CVSS < digest   -> weekly digest, no @here
#       CVSS >= digest_below_cvss     -> channel post; @here only if a patch exists
#     tier is kept as an informational label only.
#


state_path: ./state.json

notifications:
  slack:
    webhook_url: "${STACKWATCH_SLACK_WEBHOOK}"

filters:
  max_age_days: 30       # only report vulns published in the last 30 days (false = full backlog)
  drop_below_cvss: 4.0   # CVSS below this is dropped entirely
  digest_below_cvss: 7.0 # 4.0..<7.0 -> weekly digest; >= 7.0 -> alert (@here if patched)

packages:
  # --- Ruby app gems, pinned to el-ciclo (ZenHR/zenhr, Rails 8) ---
  - { name: rails,                ecosystem: RubyGems, tier: critical, version: 8.0.5 }
  - { name: rack,                 ecosystem: RubyGems, tier: critical, version: 3.1.21 }
  - { name: nokogiri,             ecosystem: RubyGems, tier: critical, version: 1.19.4 }
  - { name: devise,               ecosystem: RubyGems, tier: critical, version: 4.9.4 }
  - { name: doorkeeper,           ecosystem: RubyGems, tier: critical, version: 5.7.1 }
  - { name: jwt,                  ecosystem: RubyGems, tier: critical, version: 2.10.3 }
  - { name: ruby-saml,            ecosystem: RubyGems, tier: critical, version: 1.18.1 }
  - { name: omniauth,             ecosystem: RubyGems, tier: critical, version: 2.1.2 }
  - { name: loofah,               ecosystem: RubyGems, tier: critical, version: 2.23.1 }
  - { name: rails-html-sanitizer, ecosystem: RubyGems, tier: critical, version: 1.6.2 }
  - { name: kt-paperclip,         ecosystem: RubyGems, tier: standard, version: 7.2.2 }
  - { name: rubyzip,              ecosystem: RubyGems, tier: standard, version: 2.3.2 }
  - { name: pdfkit,               ecosystem: RubyGems, tier: standard, version: 0.8.7.3 }
  - { name: sidekiq,              ecosystem: RubyGems, tier: standard, version: 7.3.9 }
  - { name: puma,                 ecosystem: RubyGems, tier: standard, version: 6.5.0 }

  # === el-ciclo full attack surface (pinned to Gemfile.lock; per-version so up-to-date
  #     pins stay silent until a NEW affecting CVE lands). Superset added on request:
  #     everything that handles auth, untrusted input, XML/HTML, external calls, or
  #     admin power. Pure dev/test/asset gems (rubocop/rspec/bootstrap/jquery) omitted. ===

  # -- Auth / crypto / SSO / authorization --
  - { name: bcrypt,                         ecosystem: RubyGems, tier: critical, version: 3.1.22 }
  - { name: devise-two-factor,              ecosystem: RubyGems, tier: critical, version: 6.4.0 }
  - { name: devise_token_auth,              ecosystem: RubyGems, tier: critical, version: 1.2.5 }
  - { name: doorkeeper-jwt,                 ecosystem: RubyGems, tier: critical, version: 0.4.1 }
  - { name: oauth2,                         ecosystem: RubyGems, tier: critical, version: 2.0.22 }
  - { name: omniauth-oauth2,                ecosystem: RubyGems, tier: critical, version: 1.8.0 }
  - { name: omniauth-google-oauth2,         ecosystem: RubyGems, tier: critical, version: 1.1.2 }
  - { name: omniauth-microsoft_graph,       ecosystem: RubyGems, tier: critical, version: 2.0.1 }
  - { name: omniauth-apple,                 ecosystem: RubyGems, tier: critical, version: 1.3.0 }
  - { name: omniauth-rails_csrf_protection, ecosystem: RubyGems, tier: critical, version: 1.0.2 }
  - { name: json-jwt,                       ecosystem: RubyGems, tier: critical, version: 1.15.3.1 } # JWE/JWT crypto on SSO path
  - { name: cancancan,                      ecosystem: RubyGems, tier: critical, version: 3.5.0 }    # authz — logic CVE = privesc

  # -- XML / HTML / rich-text / templating (XXE / XSS / SSTI) --
  - { name: rexml,             ecosystem: RubyGems, tier: critical, version: 3.4.4 }  # XML parser behind ruby-saml; recurring ReDoS
  - { name: sanitize,          ecosystem: RubyGems, tier: critical, version: 6.1.1 }
  - { name: xmlrpc,            ecosystem: RubyGems, tier: critical, version: 0.3.3 }  # XML-RPC deserialization/XXE
  - { name: haml,              ecosystem: RubyGems, tier: standard, version: 6.3.0 }
  - { name: tinymce-rails,     ecosystem: RubyGems, tier: standard, version: 7.9.0 } # bundled rich-text editor JS (XSS)
  - { name: rich_text_renderer, ecosystem: RubyGems, tier: standard, version: 0.3.2 }
  - { name: contentful,        ecosystem: RubyGems, tier: standard, version: 2.17.1 } # renders external CMS content

  # -- Untrusted-file parsing (upload / import surfaces) --
  - { name: roo,         ecosystem: RubyGems, tier: critical, version: 2.10.1 } # xlsx import (unzip+XML) = server-side SheetJS analog
  - { name: roo-xls,     ecosystem: RubyGems, tier: critical, version: 1.2.0 }
  - { name: spreadsheet, ecosystem: RubyGems, tier: critical, version: 1.2.9 } # .xls parsing
  - { name: pdf-reader,  ecosystem: RubyGems, tier: critical, version: 2.13.0 } # parses untrusted uploaded PDFs (CVs)
  - { name: mimemagic,   ecosystem: RubyGems, tier: standard, version: 0.3.10 } # NB: old, problematic lineage
  - { name: marcel,      ecosystem: RubyGems, tier: standard, version: 1.0.4 }
  - { name: clamby,      ecosystem: RubyGems, tier: standard, version: 1.6.11 } # shells to clamscan on uploads

  # -- PDF rendering (EOL binary — real risk) --
  - { name: wkhtmltopdf-binary, ecosystem: RubyGems, tier: critical, version: 0.12.6.4 } # EOL QtWebKit — track upstream too

  # -- HTTP / SOAP / mail clients (SSRF / untrusted responses) --
  - { name: faraday,      ecosystem: RubyGems, tier: standard, version: 1.10.5 }
  - { name: httparty,     ecosystem: RubyGems, tier: standard, version: 0.24.0 }
  - { name: rest-client,  ecosystem: RubyGems, tier: standard, version: 2.1.0 }
  - { name: savon,        ecosystem: RubyGems, tier: critical, version: 2.17.3 } # SOAP/XML
  - { name: mail,         ecosystem: RubyGems, tier: standard, version: 2.8.1 }
  - { name: net-imap,     ecosystem: RubyGems, tier: standard, version: 0.6.4.1 } # ReDoS CVE history
  - { name: mailgun-ruby, ecosystem: RubyGems, tier: standard, version: 1.2.14 }
  - { name: ruby-openai,  ecosystem: RubyGems, tier: standard, version: 4.1.0 }

  # -- Serialization (deserialization surface) --
  - { name: msgpack, ecosystem: RubyGems, tier: standard, version: 1.8.3 }

  # -- Admin / powerful dashboards (broad authenticated surface) --
  - { name: rails_admin,          ecosystem: RubyGems, tier: critical, version: 3.3.0 } # historically CVE-prone admin UI
  - { name: flipper-ui,           ecosystem: RubyGems, tier: standard, version: 1.3.0 }
  - { name: mission_control-jobs, ecosystem: RubyGems, tier: standard, version: 0.6.0 }

  # -- Job runners (DB/datastore clients dropped: trusted input; OS-level pg/redis/es
  #    already watched below. aws-sdk-core kept — SQS is the job broker) --
  - { name: shoryuken,    ecosystem: RubyGems, tier: standard, version: 6.2.1 }
  - { name: solid_queue,  ecosystem: RubyGems, tier: standard, version: 1.2.1 }
  - { name: aws-sdk-core, ecosystem: RubyGems, tier: standard, version: 3.240.0 }

  # -- MCP servers (newly-exposed tool/interface surface) --
  - { name: fast-mcp, ecosystem: RubyGems, tier: critical, version: 1.6.0 }
  - { name: mcp,      ecosystem: RubyGems, tier: critical, version: 0.18.0 }

  # --- ZenATS (ZenHR/zenats + cavall2, Rails 7.1) runs OLDER majors of the same
  #     gems; second pins so a 2.x-only CVE isn't missed by the 3.x pin above ---
  - { name: rails,    ecosystem: RubyGems, tier: critical, version: 7.1.6 }
  - { name: rack,     ecosystem: RubyGems, tier: critical, version: 2.2.22 }
  - { name: nokogiri, ecosystem: RubyGems, tier: critical, version: 1.18.10 }
  - { name: sidekiq,  ecosystem: RubyGems, tier: standard, version: 6.5.12 }
  - { name: docsplit, ecosystem: RubyGems, tier: standard, version: 0.7.6 }

  # --- Frontend npm (mfe-monorepo Nx workspace + zenats-react). Versions differ per
  #     repo/MFE so left UNPINNED + severity-gated (per-version pinning isn't possible
  #     across a shared workspace with divergent MFEs). Comprehensive attack surface
  #     added on request: XSS/HTML rendering, prototype-pollution, auth/token/cookie,
  #     i18n interpolation, PDF/canvas gen, routing, JSON-schema forms. ---
  - { name: xlsx,       ecosystem: npm, tier: standard, version: 0.18.5 }
  - { name: dompurify,  ecosystem: npm, tier: critical }
  - { name: jsonwebtoken, ecosystem: npm, tier: critical }
  - { name: jwt-decode, ecosystem: npm, tier: standard }
  # HTTP client — 1.14.1/0.30.4 supply-chain compromise history; mfe resolves <1.14.1
  - { name: axios, ecosystem: npm, tier: critical }
  # XSS / HTML / rich rendering
  - { name: html-react-parser,       ecosystem: npm, tier: critical } # renders HTML -> XSS if source untrusted
  - { name: react-syntax-highlighter, ecosystem: npm, tier: standard } # refractor/highlight.js ReDoS
  - { name: primereact,              ecosystem: npm, tier: standard }
  - { name: "@mui/material",         ecosystem: npm, tier: standard }
  # Prototype pollution / core utils
  - { name: lodash, ecosystem: npm, tier: critical }
  # Auth / tokens / cookies
  - { name: js-cookie, ecosystem: npm, tier: standard } # session/token storage
  # i18n (interpolation XSS / remote resource loading)
  - { name: i18next,              ecosystem: npm, tier: standard }
  - { name: i18next-http-backend, ecosystem: npm, tier: standard }
  # PDF / canvas generation (jspdf CVE history)
  - { name: jspdf,           ecosystem: npm, tier: standard }
  - { name: jspdf-autotable, ecosystem: npm, tier: standard }
  - { name: "html2pdf.js",   ecosystem: npm, tier: standard }
  - { name: html2canvas,     ecosystem: npm, tier: standard }
  # Framework / routing / realtime
  - { name: react,            ecosystem: npm, tier: critical }
  - { name: react-router-dom, ecosystem: npm, tier: critical } # routing/redirect CVEs
  - { name: "@rails/actioncable", ecosystem: npm, tier: standard } # websocket client
  # JSON-schema form rendering + validation (schema-driven UI from server config)
  - { name: "@rjsf/core",           ecosystem: npm, tier: standard }
  - { name: "@rjsf/validator-ajv8", ecosystem: npm, tier: standard }

  # --- Swarm host + container runtime (real escape surface: docker.sock is mounted
  #     into traefik/portainer/auto-deploy = host-root-equivalent). Host versions
  #     unknown -> unpinned, severity-gated. Debian ecosystem is the closest proxy. ---
  - { name: docker.io,  ecosystem: Debian, tier: critical }
  - { name: containerd, ecosystem: Debian, tier: critical }
  - { name: runc,       ecosystem: Debian, tier: critical }
  - { name: "github.com/moby/moby",          ecosystem: Go, tier: critical }
  - { name: "github.com/docker/compose/v2",  ecosystem: Go, tier: standard }
  - { name: "github.com/traefik/traefik/v3", ecosystem: Go, tier: critical }
  - { name: "github.com/minio/minio",        ecosystem: Go, tier: standard }

  # --- Deployed datastores/proxies we run as containers. osv ecosystem matching is
  #     imperfect for the -alpine / docker.elastic.co images (Debian advisories are a
  #     proxy) — kept unpinned + severity-gated. ---
  - { name: postgresql,    ecosystem: Debian, tier: critical }
  - { name: redis,         ecosystem: Debian, tier: critical }
  - { name: elasticsearch, ecosystem: Debian, tier: standard }
  - { name: "org.apache.kafka:kafka-clients", ecosystem: Maven, tier: standard }

  # --- Debian-provisioned Swarm host OS (Ansible target). Distro unconfirmed;
  #     Debian ecosystem is the closest proxy, severity-gated. ---
  - { name: openssl, ecosystem: Debian, tier: critical }
  - { name: openssh, ecosystem: Debian, tier: critical }
  - { name: sudo,    ecosystem: Debian, tier: critical }
  - { name: systemd, ecosystem: Debian, tier: critical }
  - { name: Kernel,  ecosystem: Linux,  tier: critical }

  # --- Coverage GAPS closed: real untrusted-input surfaces that were NOT watched.
  #     ImageMagick/Ghostscript/GraphicsMagick/poppler are invoked on user uploads
  #     via kt-paperclip and Docsplit; libvips via el-ciclo image processing. ---
  - { name: imagemagick,    ecosystem: Debian, tier: critical }
  - { name: ghostscript,    ecosystem: Debian, tier: critical }
  - { name: graphicsmagick, ecosystem: Debian, tier: standard }
  - { name: poppler,        ecosystem: Debian, tier: standard }
  - { name: libvips,        ecosystem: Debian, tier: standard }

