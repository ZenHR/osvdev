# Generated from your "yes" list. Skipped everything you marked "idk".
# Adjust Debian vs Ubuntu release suffixes to match real images (e.g. Ubuntu:22.04:LTS).
#
# Notes:
#   - MySQL lineage -> Debian `mariadb` (OSV has little under mysql-8.0 alone).
#   - OpenSearch -> npm client (`@opensearch-project/opensearch`); distro `opensearch` had no OSV hits.
#   - GitHub Actions -> ecosystem name is `GitHub Actions` (space); empty history today still OK to list.
#   - Rust -> add more `crates.io` rows from Cargo.lock next to `tokio` / `serde`.
#   - "Go modules you import" -> add more `Go` rows for your actual module paths.

state_path: ./state.json

notifications:
  slack:
    webhook_url: "${STACKWATCH_SLACK_WEBHOOK}"

filters:
  max_age_days: 30   # only report CVEs published in the last 30 days.
                     # Set to `false` to disable (will report full historical backlog).

